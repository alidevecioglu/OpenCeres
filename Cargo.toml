[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alidevecioglu/OpenCeres"
rust-version = "1.85"

# Small binaries are a project goal.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
