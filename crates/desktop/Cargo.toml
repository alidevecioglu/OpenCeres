[package]
name = "openceres-desktop"
description = "OpenCeres desktop app (native, egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# egui 0.36 needs a newer compiler than the core crates.
rust-version = "1.95"
publish = false

[[bin]]
name = "openceres-desktop"
path = "src/main.rs"

[dependencies]
openceres-core = { path = "../core" }
# Window, input and immediate-mode UI. Only the OpenGL (glow) renderer and the
# Linux window systems: no wgpu, persistence, accesskit or link opening, which
# together would several-fold the binary. No default_fonts either: the app
# embeds its own subsets of Inter and Hack (see theme.rs).
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "x11", "wayland"] }
# Native "open files" dialog (NSOpenPanel / Windows / XDG portal); the portal
# backend avoids linking GTK on Linux.
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
# Deflate decoder for zipped image sets; small, pure Rust, no unsafe.
miniz_oxide = "=0.9.1"

# macOS title bar (window buttons on the toolbar, `titlebar.rs`) and menu bar
# (`menubar.rs`). The same versions rfd already links, so only a few more
# AppKit bindings are compiled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSCell", "NSView", "NSWindow", "NSButton", "NSControl"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }
raw-window-handle = "0.6"
